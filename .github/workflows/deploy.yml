jobs:
name: Build & Deploy (OKD)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          pip install flake8 black
      
      - name: Format check
        run: black --check app/ tests/
      
      - name: Lint
        run: flake8 app/ tests/ --max-line-length=120
      
      - name: Run tests
        env:
          DB_USER: test
          DB_PASSWORD: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: test
          KEYCLOAK_URL: http://localhost:8080
          KEYCLOAK_REALM: test
          JWT_ALGORITHM: RS256
        run: pytest tests/ -v --cov=app --cov-report=term

  deploy:
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install oc
        run: |
          curl -LO https://mirror.openshift.com/pub/openshift-v4/clients/oc/latest/linux/oc.tar.gz
          tar -xzf oc.tar.gz
          sudo mv oc /usr/local/bin/oc

      - name: Login to OpenShift
        run: |
          oc login "${{ secrets.OPENSHIFT_SERVER }}" \
            --token="${{ secrets.OPENSHIFT_TOKEN }}" \
            --insecure-skip-tls-verify=true
          oc project "${{ secrets.OPENSHIFT_NAMESPACE }}"

      - name: Detect changes
        id: changes
        run: |
          BASE_SHA="${{ github.event.before }}"
          HEAD_SHA="${{ github.sha }}"
          CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || true)"

          if echo "$CHANGED" | grep -qE '^k8s/'; then
            echo "k8s_changed=true" >> $GITHUB_OUTPUT
          else
            echo "k8s_changed=false" >> $GITHUB_OUTPUT
          fi

          if echo "$CHANGED" | grep -qE '^(app/|Dockerfile|requirements)'; then
            echo "code_changed=true" >> $GITHUB_OUTPUT
          else
            echo "code_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Apply manifests
        if: steps.changes.outputs.k8s_changed == 'true'
        run: |
          oc apply -f k8s/config/
          oc apply -f k8s/base/

      - name: Build image
        if: steps.changes.outputs.code_changed == 'true'
        run: |
          oc start-build care-session-service --follow
          GIT_SHA=$(git rev-parse --short HEAD)
          oc tag care-session-service:latest care-session-service:$GIT_SHA

      - name: Rollout
        if: steps.changes.outputs.code_changed == 'true' || steps.changes.outputs.k8s_changed == 'true'
        run: |
          oc rollout restart deployment/care-session-service
          oc rollout status deployment/care-session-service --timeout=5m