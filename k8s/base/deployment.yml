apiVersion: apps/v1
kind: Deployment
metadata:
  name: care-session-service
  namespace: wailsalutem-suite
spec:
  replicas: 3  # High Availability - minimum 3 replicas
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  # Zero downtime deployment
  selector:
    matchLabels:
      app: care-session-service
  template:
    metadata:
      labels:
        app: care-session-service
        version: v1
    spec:
      containers:
        - name: care-session-service
          image: image-registry.openshift-image-registry.svc:5000/wailsalutem-suite/care-session-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: wailsalutem-backend-config
            - secretRef:
                name: wailsalutem-backend-secrets
          env:
            - name: APP_VERSION
              value: "1.0.0"
            # OpenTelemetry Configuration
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability.svc.cluster.local:4317"
            - name: OTEL_SERVICE_NAME
              value: "care-session-service"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=wailsalutem,deployment.environment=production"
            - name: SERVICE_VERSION
              value: "1.0.0"
            - name: SERVICE_NAMESPACE
              value: "wailsalutem"
            - name: LOG_LEVEL
              value: "INFO"
            - name: OTEL_TRACES_SAMPLER
              value: "parentbased_always_on"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3