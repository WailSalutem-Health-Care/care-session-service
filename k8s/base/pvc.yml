apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: care-session-service-logs
  labels:
    app: care-session-service
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard-rwo  # Adjust based on your cluster's storage classes
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: care-session-service-reports
  labels:
    app: care-session-service
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard-rwo  # For storing generated reports
